<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>LocaShare — Simulateur téléphone</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f0f13;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(124,58,237,0.18) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(99,102,241,0.12) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      padding: 40px 20px;
      gap: 32px;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 36px; height: 36px; border-radius: 9px;
      background: linear-gradient(135deg, #7C3AED, #6366F1);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: white;
      box-shadow: 0 4px 16px rgba(124,58,237,0.45);
    }
    .app-name { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.4px; }
    .badge {
      background: rgba(124,58,237,0.22); color: #a78bfa;
      border: 1px solid rgba(124,58,237,0.35);
      font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    }

    /* ─── Phone shell ─── */
    .phone-wrap {
      position: relative;
      filter: drop-shadow(0 40px 80px rgba(0,0,0,0.7)) drop-shadow(0 0 60px rgba(124,58,237,0.2));
    }

    .phone {
      position: relative;
      width: 393px;
      height: 852px;
      background: #1a1a1a;
      border-radius: 55px;
      padding: 14px;
      box-shadow:
        inset 0 0 0 1.5px rgba(255,255,255,0.12),
        inset 0 0 0 3px rgba(0,0,0,0.8),
        0 0 0 1px rgba(0,0,0,0.6);
    }

    /* Side buttons */
    .phone::before {
      content: '';
      position: absolute;
      left: -3px;
      top: 140px;
      width: 3px;
      height: 36px;
      background: #2a2a2a;
      border-radius: 3px 0 0 3px;
      box-shadow: 0 52px 0 #2a2a2a, 0 96px 0 #2a2a2a;
    }
    .phone::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 180px;
      width: 3px;
      height: 72px;
      background: #2a2a2a;
      border-radius: 0 3px 3px 0;
    }

    /* Screen */
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 44px;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      gap: 6px;
    }
    .island-cam {
      width: 12px; height: 12px; border-radius: 50%;
      background: #1a1a1a;
      border: 2px solid #111;
      position: relative;
    }
    .island-cam::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: #0a2a4a;
      border-radius: 50%;
    }

    /* Status bar */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 54px;
      z-index: 99;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 16px 28px 0;
      pointer-events: none;
    }
    .status-time {
      font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.9);
      font-variant-numeric: tabular-nums;
    }
    .status-icons {
      display: flex; align-items: center; gap: 6px;
    }
    .status-icons svg { fill: rgba(255,255,255,0.9); }

    /* Home indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(255,255,255,0.35);
      border-radius: 3px;
      z-index: 100;
    }

    /* iFrame */
    .app-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      border-radius: 44px;
    }

    /* ─── Controls ─── */
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
      font-size: 13px; font-weight: 600;
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .ctrl-btn:hover {
      background: rgba(124,58,237,0.2);
      border-color: rgba(124,58,237,0.5);
      color: #a78bfa;
    }
    .ctrl-btn.active {
      background: rgba(124,58,237,0.25);
      border-color: rgba(124,58,237,0.6);
      color: #c4b5fd;
    }
    .url-display {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      font-family: 'SF Mono', monospace;
    }

    /* Clock update */
    #clock { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">L</div>
    <span class="app-name">LocaShare</span>
    <span class="badge">Preview</span>
  </div>

  <div class="phone-wrap">
    <div class="phone">
      <div class="screen">

        <!-- Dynamic Island -->
        <div class="dynamic-island">
          <div class="island-cam"></div>
        </div>

        <!-- Status bar -->
        <div class="status-bar">
          <span class="status-time" id="clock">9:41</span>
          <div class="status-icons">
            <!-- Signal -->
            <svg width="17" height="12" viewBox="0 0 17 12">
              <rect x="0" y="8" width="3" height="4" rx="1"/>
              <rect x="4.5" y="5.5" width="3" height="6.5" rx="1"/>
              <rect x="9" y="3" width="3" height="9" rx="1"/>
              <rect x="13.5" y="0" width="3" height="12" rx="1"/>
            </svg>
            <!-- Wifi -->
            <svg width="16" height="12" viewBox="0 0 16 12">
              <path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm0-4a5.5 5.5 0 014.24 2l1.5-1.5A7.5 7.5 0 008 3.5a7.5 7.5 0 00-5.74 2.5l1.5 1.5A5.5 5.5 0 018 5.5zm0-5a9.5 9.5 0 017.07 3.13l1.5-1.5A11.5 11.5 0 008 .5a11.5 11.5 0 00-8.57 3.63l1.5 1.5A9.5 9.5 0 018 .5z"/>
            </svg>
            <!-- Battery -->
            <svg width="25" height="12" viewBox="0 0 25 12">
              <rect x="0" y="1" width="21" height="10" rx="3" stroke="rgba(255,255,255,0.9)" stroke-width="1.2" fill="none"/>
              <rect x="22" y="4" width="2" height="4" rx="1" fill="rgba(255,255,255,0.5)"/>
              <rect x="1.5" y="2.5" width="16" height="7" rx="2" fill="rgba(255,255,255,0.9)"/>
            </svg>
          </div>
        </div>

        <!-- App -->
        <iframe
          class="app-iframe"
          id="app-frame"
          src="http://localhost:8081"
          allow="accelerometer; camera; microphone; geolocation"
          title="LocaShare App"
        ></iframe>

        <!-- Home indicator -->
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn active" id="btn-app" onclick="switchTo('app', this)">
      📱 App mobile
    </button>
    <button class="ctrl-btn" id="btn-web" onclick="switchTo('web', this)">
      🌐 Site web
    </button>
    <div style="width:1px;height:24px;background:rgba(255,255,255,0.1)"></div>
    <button class="ctrl-btn" onclick="reload()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      Recharger
    </button>
    <span class="url-display" id="url-display">localhost:8081</span>
  </div>

  <script>
    const URLS = {
      app: 'http://localhost:8081',
      web: 'http://localhost:8090/claude%20cr%C3%A9ation/application-locaShear/locashare-website',
    };
    let current = 'app';

    function switchTo(mode, btn) {
      current = mode;
      document.getElementById('app-frame').src = URLS[mode];
      document.getElementById('url-display').textContent = mode === 'app' ? 'localhost:8081' : 'locashare-website.html';
      document.getElementById('btn-app').classList.toggle('active', mode === 'app');
      document.getElementById('btn-web').classList.toggle('active', mode === 'web');
    }

    function reload() {
      const f = document.getElementById('app-frame');
      f.src = f.src;
    }

    // Live clock
    function updateClock() {
      const now = new Date();
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m;
    }
    updateClock();
    setInterval(updateClock, 10000);
  </script>
</body>
</html>
