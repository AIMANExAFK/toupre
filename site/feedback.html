<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Toupré — Ton avis</title>
<meta name="description" content="Donne ton avis sur la bêta de Toupré."/>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --ink:#0A0A0A; --bg:#F4F3F0; --surface:#FFFFFF; --border:#E4E2DD;
    --text:#111111; --text-2:#5E5E5E; --text-3:#6B6B6B; --ok:#15803D;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 64px}
  header.hero{
    background:var(--ink); color:#fff; margin:0 -16px 0; padding:40px 28px 34px;
    border-radius:0 0 32px 32px;
  }
  .brand{font-size:22px; font-weight:600; letter-spacing:6px}
  .hero p{margin:10px 0 0; color:rgba(255,255,255,.7); font-size:15px}
  h1{font-size:26px; font-weight:600; letter-spacing:-.01em; margin:28px 0 6px}
  .sub{color:var(--text-2); font-size:15px; margin:0 0 24px}
  form{display:flex; flex-direction:column; gap:22px}
  .field label{display:block; font-weight:600; font-size:15px; margin-bottom:8px}
  .field .hint{font-weight:400; color:var(--text-3); font-size:13px}
  textarea,input[type=text]{
    width:100%; font-family:inherit; font-size:16px; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; resize:vertical;
  }
  textarea{min-height:96px}
  textarea:focus,input:focus{outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink)}
  .stars{display:flex; gap:8px}
  .star{
    width:52px; height:52px; border:1px solid var(--border); background:var(--surface);
    border-radius:14px; font-size:24px; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center; transition:transform .08s ease;
  }
  .star[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); transform:scale(1.03)}
  .star:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  button.submit{
    font-family:inherit; font-size:16px; font-weight:600; color:#fff; background:var(--ink);
    border:none; border-radius:999px; padding:17px; cursor:pointer; margin-top:4px;
  }
  button.submit:disabled{opacity:.55; cursor:default}
  .app-link{display:inline-block; margin-top:18px; color:var(--text-2); font-size:14px; text-decoration:underline}
  .done{display:none; text-align:center; padding:48px 8px}
  .done .check{
    width:64px; height:64px; border-radius:50%; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 20px;
  }
  .done h2{font-size:22px; font-weight:600; margin:0 0 8px}
  .done p{color:var(--text-2); margin:0 0 22px}
  .err{color:#B42318; font-size:14px; display:none; margin-top:4px}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--bg:#0A0A0A; --surface:#161616; --border:#2A2A2A; --text:#F5F5F5; --text-2:#A9A9A9; --text-3:#8A8A8A; --ink:#1C1C1C}
    :root:not([data-theme="light"]) .brand,:root:not([data-theme="light"]) header.hero{color:#fff}
    :root:not([data-theme="light"]) button.submit,:root:not([data-theme="light"]) .star[aria-pressed="true"],:root:not([data-theme="light"]) .done .check{background:#EDEDED; color:#0A0A0A; border-color:#EDEDED}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">TOUPRÉ</div>
    <p>Merci de tester la bêta 🙏</p>
  </header>

  <main>
    <div id="form-view">
      <h1>Ton avis compte</h1>
      <p class="sub">2 minutes, tout est optionnel. Sois honnête, c'est comme ça que l'app s'améliore.</p>
      <form id="fb-form" novalidate>
        <div class="field">
          <label>Ton ressenti global</label>
          <div class="stars" role="group" aria-label="Note de 1 à 5">
            <button type="button" class="star" data-v="1" aria-pressed="false" aria-label="1 sur 5">★</button>
            <button type="button" class="star" data-v="2" aria-pressed="false" aria-label="2 sur 5">★</button>
            <button type="button" class="star" data-v="3" aria-pressed="false" aria-label="3 sur 5">★</button>
            <button type="button" class="star" data-v="4" aria-pressed="false" aria-label="4 sur 5">★</button>
            <button type="button" class="star" data-v="5" aria-pressed="false" aria-label="5 sur 5">★</button>
          </div>
        </div>
        <div class="field">
          <label for="liked">Qu'est-ce qui t'a plu ? <span class="hint">(ce qui marche bien)</span></label>
          <textarea id="liked" name="liked"></textarea>
        </div>
        <div class="field">
          <label for="issues">Qu'est-ce qui coince ? <span class="hint">(bugs, trucs confus, lenteurs)</span></label>
          <textarea id="issues" name="issues"></textarea>
        </div>
        <div class="field">
          <label for="suggestions">Une idée, une envie ? <span class="hint">(fonctionnalité manquante)</span></label>
          <textarea id="suggestions" name="suggestions"></textarea>
        </div>
        <div class="field">
          <label for="name">Ton prénom <span class="hint">(optionnel)</span></label>
          <input type="text" id="name" name="name" autocomplete="given-name"/>
        </div>
        <div class="field">
          <label for="contact">Email ou tél si tu veux qu'on te recontacte <span class="hint">(optionnel)</span></label>
          <input type="text" id="contact" name="contact" autocomplete="email"/>
        </div>
        <button type="submit" class="submit" id="submit-btn">Envoyer mon avis</button>
        <p class="err" id="err">Oups, l'envoi a échoué. Réessaie dans un instant.</p>
      </form>
    </div>

    <div id="done-view" class="done">
      <div class="check">✓</div>
      <h2>Merci beaucoup !</h2>
      <p>Ton retour est bien arrivé. Il va droit au but pour améliorer Toupré.</p>
      <a class="app-link" href="https://toupre-app.vercel.app">← Retourner à l'app</a>
    </div>
  </main>
</div>

<script>
  var API = "https://toupre-api.vercel.app/api/feedback";
  var rating = null;
  var stars = Array.prototype.slice.call(document.querySelectorAll('.star'));
  stars.forEach(function(s){
    s.addEventListener('click', function(){
      rating = parseInt(s.dataset.v, 10);
      stars.forEach(function(o){ o.setAttribute('aria-pressed', parseInt(o.dataset.v,10) <= rating ? 'true':'false'); });
    });
  });

  var form = document.getElementById('fb-form');
  var btn = document.getElementById('submit-btn');
  var err = document.getElementById('err');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    err.style.display = 'none';
    var payload = {
      rating: rating,
      liked: form.liked.value,
      issues: form.issues.value,
      suggestions: form.suggestions.value,
      name: form.name.value,
      contact: form.contact.value
    };
    btn.disabled = true; btn.textContent = 'Envoi…';
    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(r){
      if (!r.ok) throw new Error('bad');
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('done-view').style.display = 'block';
      window.scrollTo(0,0);
    }).catch(function(){
      btn.disabled = false; btn.textContent = 'Envoyer mon avis';
      err.style.display = 'block';
    });
  });
</script>
</body>
</html>
